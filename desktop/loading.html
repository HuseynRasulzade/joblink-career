<!doctype html>
<html lang="az"><head><meta charset="utf-8"><title>Joblink</title>
<style>
  html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f8f6;color:#12332e}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
  .logo{font-size:56px;font-weight:800;letter-spacing:-3px}.logo span{color:#187c6c}
  .spin{width:38px;height:38px;border:4px solid #cfe3dd;border-top-color:#187c6c;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  p{margin:0;color:#5b726c;max-width:420px;line-height:1.6}
</style></head>
<body><div class="box"><div class="logo">joblink<span>✳</span></div><div class="spin"></div>
<p>Joblink başlayır…<br>İlk açılış 1–2 dəqiqə çəkə bilər. Pəncərəni bağlamayın.</p></div></body></html>
